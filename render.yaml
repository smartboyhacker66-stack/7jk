services:
  - type: web
    name: openrouter-mcp
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        generateValue: true
